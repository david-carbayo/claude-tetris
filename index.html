<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <!-- High scores (game over only) -->
        <div id="hs-gameover" class="hs" hidden>
          <p id="hs-new-record" class="hs-new-record" hidden>¡Nuevo récord!</p>
          <form id="hs-form" class="hs-form" hidden>
            <input id="hs-name" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" spellcheck="false" aria-label="Nombre del jugador" />
            <button type="submit">Guardar</button>
          </form>
          <div id="hs-scores"></div>
          <p id="hs-stats" class="hs-stats"></p>
          <button type="button" class="hs-clear-btn">Borrar récords</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- High scores: start screen shown before the first game -->
    <div id="start-screen" class="overlay hidden">
      <div class="overlay-box hs">
        <p class="hs-title">TETRIS</p>
        <p class="hs-heading">RÉCORDS</p>
        <div id="start-scores"></div>
        <p id="start-stats" class="hs-stats"></p>
        <button id="start-btn" type="button">Jugar</button>
        <p class="hs-hint">Pulsa <kbd>Enter</kbd> para jugar</p>
        <button type="button" class="hs-clear-btn">Borrar récords</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
